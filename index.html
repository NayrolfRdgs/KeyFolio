<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KeyFolio — Application de gestion immobilière multi-biens, portable et hors-ligne" />
    <meta name="author" content="Flow (Florian) — FlowCreativeStudio" />
    <title>KeyFolio — Gestion Immobilière</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Diagnostic: catch ALL errors before React loads
      window.__KEYFOLIO_ERRORS = [];
      window.onerror = function(msg, url, line, col, error) {
        window.__KEYFOLIO_ERRORS.push({msg, url, line, col, stack: error && error.stack});
        console.error('[KEYFOLIO EARLY ERROR]', msg, url, line, col, error);
        var root = document.getElementById('root');
        if (root) {
          root.style.cssText = 'padding:40px;font-family:system-ui;background:#1e293b;color:#f8fafc;min-height:100vh;';
          root.innerHTML = '<h2 style="color:#ef4444">⚠️ Erreur de chargement KeyFolio</h2>' +
            '<p style="color:#94a3b8">' + msg + '</p>' +
            '<pre style="background:#0f172a;color:#fca5a5;padding:12px;border-radius:6px;font-size:11px;overflow:auto;max-height:400px;border:1px solid #7f1d1d">' +
            (error && error.stack ? error.stack : msg) + '</pre>' +
            '<button onclick="location.reload()" style="margin-top:16px;background:#6366f1;color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-weight:600">↻ Recharger</button>';
        }
      };
      window.addEventListener('unhandledrejection', function(e) {
        console.error('[KEYFOLIO UNHANDLED REJECTION]', e.reason);
        window.__KEYFOLIO_ERRORS.push({type:'rejection', reason: String(e.reason), stack: e.reason && e.reason.stack});
      });
      // Timeout: if after 5 seconds root is still empty, show diagnostic
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          root.style.cssText = 'padding:40px;font-family:system-ui;background:#1e293b;color:#f8fafc;min-height:100vh;';
          var errHtml = '<h2 style="color:#f59e0b">⏳ KeyFolio: le chargement a échoué</h2>';
          errHtml += '<p style="color:#94a3b8">React n\'a pas rendu après 5 secondes.</p>';
          if (window.__KEYFOLIO_ERRORS.length > 0) {
            errHtml += '<h3 style="color:#ef4444;margin-top:16px">Erreurs détectées (' + window.__KEYFOLIO_ERRORS.length + '):</h3>';
            window.__KEYFOLIO_ERRORS.forEach(function(e, i) {
              errHtml += '<pre style="background:#0f172a;color:#fca5a5;padding:8px;border-radius:4px;font-size:11px;margin-top:8px;overflow:auto;border:1px solid #7f1d1d">' +
                '#' + (i+1) + ': ' + (e.msg || e.reason || 'Unknown') + '\n' + (e.stack || '') + '</pre>';
            });
          } else {
            errHtml += '<p style="color:#94a3b8;margin-top:8px">Aucune erreur JavaScript capturée. Le problème est peut-être un module bloqué ou un import circulaire.</p>';
            errHtml += '<p style="color:#94a3b8">Ouvrez la console du navigateur (F12) pour plus de détails.</p>';
          }
          errHtml += '<button onclick="location.reload()" style="margin-top:16px;background:#6366f1;color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-weight:600">↻ Recharger</button>';
          root.innerHTML = errHtml;
        }
      }, 5000);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
